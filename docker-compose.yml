# 로컬 실행용 MariaDB
# 최초 실행 시 backend-spring/sql 의 스키마와 샘플 데이터가 자동으로 적재됩니다.
services:
  db:
    image: mariadb:11
    container_name: bingo-db
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: bingo
      MARIADB_USER: bingo
      MARIADB_PASSWORD: ecolink_local
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./backend-spring/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend-spring/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - bingo-db-data:/var/lib/mysql

volumes:
  bingo-db-data:
